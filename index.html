<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>مترجم مانجا تلقائي</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.0.2/dist/tesseract.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f2f2f2;
      padding: 20px;
      direction: rtl;
    }

    input, button {
      padding: 10px;
      font-size: 16px;
      margin: 10px;
    }

    canvas {
      margin-top: 20px;
      border: 1px solid #ccc;
      max-width: 100%;
    }

    #loading {
      color: green;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h2>📘 مترجم مانجا تلقائي (نسخة مطورة)</h2>
  <p>ارفع صورة مانجا بالإنجليزية، وسنقوم بترجمتها للعربية مباشرة داخل الصورة</p>

  <input type="file" id="imageUpload" accept="image/*">
  <button id="downloadBtn" style="display:none;">📥 تحميل الصورة النهائية</button>
  <div id="loading"></div>
  <canvas id="canvas"></canvas>

  <script>
    const imageInput = document.getElementById('imageUpload');
    const downloadBtn = document.getElementById('downloadBtn');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const loading = document.getElementById('loading');

    imageInput.addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file) return;

      const img = new Image();
      img.onload = async () => {
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);

        loading.textContent = "📄 جاري استخراج النصوص...";
        const result = await Tesseract.recognize(img, 'eng', {
          logger: m => console.log(m)
        });

        const lines = result.data.lines;

        loading.textContent = "🌐 جاري الترجمة وتعديل الصورة...";
        for (const line of lines) {
          const englishText = line.text.trim();
          if (englishText.length < 2) continue; // تجاهل النصوص الصغيرة

          // الترجمة
          const response = await fetch('https://libretranslate.de/translate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              q: englishText,
              source: 'en',
              target: 'ar',
              format: 'text'
            })
          });

          const data = await response.json();
          const arabicText = data.translatedText;

          // تبييض المكان الأصلي
          ctx.fillStyle = 'white';
          ctx.fillRect(line.bbox.x0, line.bbox.y0, line.bbox.x1 - line.bbox.x0, line.bbox.y1 - line.bbox.y0);

          // كتابة الترجمة مكان النص الأصلي
          ctx.fillStyle = 'black';
          ctx.font = `${Math.max(14, line.bbox.y1 - line.bbox.y0)}px Arial`;
          ctx.textAlign = 'center';
          ctx.fillText(arabicText, (line.bbox.x0 + line.bbox.x1) / 2, (line.bbox.y0 + line.bbox.y1) / 2 + 5);
        }

        loading.textContent = "✅ تم الانتهاء!";
        downloadBtn.style.display = 'inline-block';
      };

      img.src = URL.createObjectURL(file);
    });

    downloadBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'translated-manga.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  </script>

</body>
</html>
